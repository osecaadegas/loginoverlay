name: Build latest SC Web Transitions download

on:
  push:
    branches: [main]
    paths:
      - ".codex-dev/sc-web-transitions-v3.15-source/**"
      - "scripts/package-sc-web-transitions.ps1"
      - "scripts/build-sc-web-transitions.ps1"
      - ".github/workflows/sc-web-transitions-package.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sc-web-transitions-package-main
  cancel-in-progress: false

jobs:
  build-and-refresh-download:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache-dependency-path: .codex-dev/sc-web-transitions-v3.15-source/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test transition controller
        working-directory: .codex-dev/sc-web-transitions-v3.15-source
        run: |
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { throw "Controller tests failed" }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw "Controller vet failed" }

      - name: Check renderer JavaScript and inline overlay syntax
        working-directory: .codex-dev/sc-web-transitions-v3.15-source
        run: |
          foreach ($file in @('money-vfx3d.js','ice-vfx3d.js','gas-vfx3d.js','gpu-vfx3d.js','expansion-effects.js','test_gpu_shaders_browser.mjs')) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax failed: $file" }
          }
          foreach ($test in @('run_gpu_renderer_api_test.mjs','test_overlay_inline_syntax.mjs')) {
            node $test
            if ($LASTEXITCODE -ne 0) { throw "Renderer regression failed: $test" }
          }

      - name: Build reproducible Windows application and installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler is unavailable' }
          ./scripts/build-sc-web-transitions.ps1 -RepoRoot "$env:GITHUB_WORKSPACE" -GoBinary (Get-Command go).Source -InnoCompiler $compiler

      - uses: actions/upload-artifact@v4
        with:
          name: SC-Web-Transitions-verified-Windows-release
          path: public/SC_Web_Transitions.zip
          if-no-files-found: error

      - name: Publish refreshed website package
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/SC_Web_Transitions.zip
          git diff --cached --quiet
          $packageChanged = $LASTEXITCODE
          if ($packageChanged -eq 1) {
            git commit -m "chore: refresh SC Web Transitions download"
            git push origin HEAD:main
          } elseif ($packageChanged -ne 0) {
            throw "Unable to check the refreshed download package."
          } else {
            Write-Output "The website package already matches the latest app source."
          }
