<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>StreamersCenter Slot Capture</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Slot Capture</h1>
      <label>
        URL do StreamersCenter
        <input id="apiBase" placeholder="https://streamerscenter.com" />
      </label>
      <label>
        Código de emparelhamento
        <input id="pairingCode" placeholder="ABC-12" />
      </label>
      <button id="pair">Emparelhar extensão</button>
      <button id="forget" class="secondary">Remover ligação</button>
      <p id="status"></p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
