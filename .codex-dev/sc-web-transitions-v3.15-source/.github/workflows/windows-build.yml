name: SC Web Transitions Windows build
on:
  push:
    paths:
      - "**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.2"
          cache-dependency-path: go.sum
      - name: Test Go controller
        run: go test ./...
      - name: Build Windows x64 application
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags="-s -w -H windowsgui" -o SC_Web_Transitions_v3.15.0.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: SC-Web-Transitions-Windows-x64
          path: SC_Web_Transitions_v3.15.0.exe
          if-no-files-found: error
