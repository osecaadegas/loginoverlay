name: SC Web Transitions Windows build
on:
  push:
    paths:
      - "**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache-dependency-path: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Go controller
        run: |
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { throw "Controller tests failed" }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw "Controller vet failed" }
      - name: Build Windows x64 application
        shell: pwsh
        run: |
          python build_icon_resource.py
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -trimpath -buildvcs=false -ldflags="-s -w -H windowsgui -X main.buildRevision=$env:GITHUB_SHA" -o SC_Web_Transitions_v3.18.0_Cinematic_GPU.exe .
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: SC-Web-Transitions-Windows-x64
          path: SC_Web_Transitions_v3.18.0_Cinematic_GPU.exe
          if-no-files-found: error
