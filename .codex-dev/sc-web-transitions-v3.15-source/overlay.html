 try{return expansionGPU.render(stage,p,age)}catch(e){
  console.error('GPU 3D rendering failure; switching to Canvas2D volumetric compatibility:',e);
  gpuUnavailable=String(e);try{expansionGPU.dispose();expansionGPU.hide()}catch(_){ }
  return false;
 }
}

 }else if(job.effect==='money'){

  else drawMoneyCover(p);
 }
 else if(job.effect==='ice')drawIceCover(p);
 else if(job.effect==='inferno'){if(!renderGPU('cover',p,visualSeconds))drawInfernoCover(p,smokeCoverAge);}
 else drawSmokeCover(p,smokeCoverAge)

 }else if(job.effect==='money'){

async function signal(action,id,reason=''){

 const key=id+':'+action;if(signalRequests.has(key))return signalRequests.get(key);
 const fraction=(action==='covered'||action==='reveal')?'&coverage='+lastMeasuredCoverage.toFixed(5)+'&frame='+lastCoveredFrame+'&confirmations='+coverageConfirmations:'';
 const url='/'+action+'?rid='+encodeURIComponent(RID)+'&id='+id+fraction+(reason?'&reason='+encodeURIComponent(reason):'');
 const request=(async()=>{
  for(let attempt=0;attempt<5&&id===jobId;attempt++){
   const abort=new AbortController(),timeout=setTimeout(()=>abort.abort(),1200);
   try{const response=await fetch(url,{method:'POST',cache:'no-store',signal:abort.signal});
    if(response.ok)return true;
    if(response.status===409||response.status===410)return false;
   }catch(e){console.warn('Bridge retry',action,attempt+1,String(e))}finally{clearTimeout(timeout)}
   await new Promise(resolve=>setTimeout(resolve,100*Math.pow(2,attempt)));
  }
  return false;
 })();signalRequests.set(key,request);
 try{return await request}finally{signalRequests.delete(key)}
}
let lastMeasuredCoverage=0;
function tryCoverageAck(action,now){
 if(now-lastCoverageCheck<80)return;
 lastCoverageCheck=now;if(!coverageWaitStarted)coverageWaitStarted=now;
 const measured=renderCoverage();
 if(measured===null){
  if(now-coverageWaitStarted>4000){stage='error';if(!demo)signal('error',jobId,'GPU coverage fence timed out');}
  return;
 }
 lastMeasuredCoverage=measured;
 if(lastMeasuredCoverage>=.995){
  if(lastCoveredFrame===lastCoverageSampleFrame)return;
  lastCoveredFrame=lastCoverageSampleFrame;coverageConfirmations++;
  if(coverageConfirmations<2)return;
  if(action==='covered')ackCovered=true;else ackReveal=true;
  if(demo){if(action==='reveal'){gasInArmed=true;gasInReleaseAt=now+80}}
  else signal(action,jobId);
 }else {
  coverageConfirmations=0;lastCoveredFrame=-1;
  if(now-coverageWaitStarted>1400){
  if(action==='covered')ackCovered=true;else ackReveal=true;
  if(!demo)signal('error',jobId,`Rendered coverage ${(lastMeasuredCoverage*100).toFixed(2)}% below safe 99.5% threshold`);
  else {console.error('Coverage verification failed',job.effect,lastMeasuredCoverage);stage='error'}
  }
 }
}
function animate(now){
 const renderBegin=performance.now();resize();
 const inactive=['idle','done','loading','prepared','error'].includes(stage);
 try{

  if(inactive){hideRenderers();lastFrame=0}
  else{
   if(lastFrame){const delta=now-lastFrame;frameIntervals.push(delta);if(frameIntervals.length>8192)frameIntervals.shift();missedFrames+=Math.max(0,Math.round(delta/(1000/60))-1)}
   frameSequence++;lastFrame=now;if(!sampleStart)sampleStart=now;framesThisSample++;
  }
  visualSeconds=stage==='cover'?Math.max(0,(now-coverStarted)/1000):smokeReleaseAge+Math.max(0,(now-started)/1000);
  if(stage==='cover'&&job){
   const p=clamp((now-coverStarted)/coverTime(job.effect));smokeCoverAge=(now-coverStarted)/1000;drawCover(p);
   if(p>=1&&!ackCovered)tryCoverageAck('covered',now);
  }else if(stage==='play'&&job){
   const incoming=job.direction==='in';
   if(incoming&&job.camera_ready&&!gasInArmed){gasInArmed=true;gasInReleaseAt=now+80}
   let t;
   if(incoming&&(job.effect==='money'||job.effect==='ice'||job.effect==='inferno'||isExpansion(job.effect))){
    const buildSeconds=job.duration*(job.effect==='ice'?ICE_IN_BUILD:job.effect==='inferno'?.61:isExpansion(job.effect)?window.SCExpansion.TYPES[job.effect].inBuild:MONEY_IN_BUILD);

   }else t=incoming?(gasInArmed?Math.max(0,(now-gasInReleaseAt)/1000):0):clamp((now-started)/1000,0,job.duration);
   playEffect(clamp(t,0,job.duration));
   const p=clamp(t/job.duration);
   if(incoming&&!ackReveal&&(job.effect==='ice'?reached(p,ICE_IN_BUILD):job.effect==='money'?reached(p,MONEY_IN_BUILD):job.effect==='inferno'?reached(p,.61):isExpansion(job.effect)?reached(p,window.SCExpansion.TYPES[job.effect].inBuild):true))tryCoverageAck('reveal',now);

    sampleStart=now;framesThisSample=0;
   }
  }
 }catch(e){
  console.error('Renderer failed safely',e);stage='error';ctx.clearRect(0,0,W,H);hideRenderers();
  if(!demo)signal('error',jobId,String(e));
 }finally{
  if(inactive)setTimeout(()=>requestAnimationFrame(animate),100);else requestAnimationFrame(animate);

}

async function prepare(state){

  if(state.effect==='money'){if(!bill){const loadedBill=await image('./bill.png');if(epoch!==prepareEpoch)return;bill=loadedBill}if(epoch!==prepareEpoch)return;setupMoney(state.intensity)}

async function poll(){if(demo)return;
 try{
  const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),2500);let response;
  try{response=await fetch('/state?rid='+encodeURIComponent(RID)+'&ts='+Date.now(),{cache:'no-store',signal:abort.signal})}finally{clearTimeout(timer)}
  if(!response.ok)throw Error('Renderer state HTTP '+response.status);
  const s=await response.json();
  if(s.phase==='idle'){
   if(stage!=='idle'){prepareEpoch++;loading=false;stage='idle';job=null;releaseTransient()}
  }else if(s.phase==='prepare'&&s.job_id!==jobId&&!loading){prepare(s)}
  else if(s.job_id===jobId&&s.phase==='cover'&&stage==='prepared'){
   job=s;stage='cover';coverStarted=performance.now();resetMetrics();smokeReleaseAge=0;ackCovered=false;
  }else if(s.job_id===jobId&&s.phase==='play'&&['cover','prepared'].includes(stage)){
   const fromCover=stage==='cover';job=s;stage='play';smokeReleaseAge=fromCover?Math.max(0,(performance.now()-coverStarted)/1000):0;infernoCoverSeconds=smokeReleaseAge;
   started=performance.now();if(!fromCover)resetMetrics();lastCoverageCheck=coverageWaitStarted=0;gasInArmed=false;gasInReleaseAt=0;ackReveal=ackDone=false;
  }else if(s.job_id===jobId&&s.phase==='play'&&stage==='play'&&job)job.camera_ready=!!s.camera_ready;
 }catch(e){/* Recovery remains owned by the controller's bounded renderer watchdog. */}
}
