 const c=document.createElement('canvas');c.width=W;c.height=H;const q=c.getContext('2d',{willReadFrequently:true});q.drawImage(img,0,0,W,H);
 const im=q.getImageData(0,0,W,H),d=im.data;let clear=0,greenEdge=0,edge=0,total=0;

function drawSubject(alpha=1){if(subject&&alpha>0){ctx.save();ctx.globalAlpha=clamp(alpha);ctx.drawImage(subject,0,0,W,H);ctx.restore()}}
function note(c,n,x=n.x,y=n.y,t=0,alpha=1,scale=1){

function setupMoney(intensity){
 billParts=[];const b=field.bounds,density=clamp(intensity/100),base=clamp(b.w/mix(15,23,density),12,60),row=base*.36;
 const stepX=base*.54,stepY=row*.71;

 // placement created. Large, medium, small and micro notes all contribute.
 for(let y=b.y+stepY*.25,r=0;y<b.y+b.h+stepY*.6;y+=stepY,r++){
  for(let x=b.x+(r%2)*stepX*.5;x<b.x+b.w+stepX;x+=stepX){
   const jitter=stepX*.19,x0=x+rand(-jitter,jitter),y0=y+rand(-stepY*.25,stepY*.25);
   if(!field.contains(x0,y0,95))continue;
   const special=Math.random(),size=special<.12?1.7:special<.35?1.13:special<.79?.78:.48;
   const w=base*size;
   const dx=x0-W*.5,dy=y0-H*.5;

    driftX:dx*.28+rand(-W*.3,W*.3),driftY:rand(-H*.35,-H*.1),scatterX:rand(-W*.45,W*.45),
    assemble:rand(0,.47),vx:rand(-b.w*.36,b.w*.36),vy:rand(-H*.48,-H*.18),gravity:rand(.68,1.13),wave:rand(2,13)});
  }
 }
 // additional micro banknotes eliminate holes in facial/shoulder areas

 for(let i=0;i<extras;i++){

  billParts.push({x:p[0],y:p[1],w:base*rand(.32,.56),rot:rand(-.45,.45),spin:rand(-5,5),phase:rand(0,6.28),
   driftX:rand(-W*.28,W*.28),driftY:rand(-H*.3,-H*.06),scatterX:rand(-W*.4,W*.4),assemble:rand(0,.51),
   vx:rand(-b.w*.36,b.w*.36),vy:rand(-H*.42,-H*.15),gravity:rand(.7,1.13),wave:rand(3,12)});

}
function drawMoneyCover(p){
 if(p<.12){drawSubject();return}
 const q=smooth((p-.12)/.72);
 drawSubject(1-smooth((p-.23)/.57));
 // Subset of note sprites travels back to its mask position, then holds still.
 // Final mosaic covers tiny residual gaps while keeping a strict silhouette.
 for(const n of billParts){const r=smooth((q-n.assemble)/Math.max(.15,1-n.assemble));if(r<=0)continue;
  note(ctx,n,n.x+n.driftX*(1-r),n.y+n.driftY*(1-r),0,r, mix(.36,1,r));
 }
 if(q>.82){ctx.save();ctx.globalAlpha=smooth((q-.82)/.18);ctx.drawImage(billMosaic,0,0);ctx.restore()}
}
function drawMoney(t,dir,duration){const p=clamp(t/duration),b=field.bounds;
 if(dir==='out'){
  // Freeze the completely assembled bill-shaped person before falling.
  if(p<.085){ctx.drawImage(billMosaic,0,0);return}
  const f=clamp((p-.085)/.71),seconds=f*duration;
  for(const n of billParts){const q=clamp((f-n.assemble*.19)/.77);if(q<=0)note(ctx,n);else{
   const time=q*duration;
   const x=n.x+n.vx*time+Math.sin(time*7+n.phase)*n.wave;
   const y=n.y+n.vy*time+H*.56*n.gravity*time*time;
   const alpha=1-smooth((p-.70)/.18);
   note(ctx,n,x,y,time,alpha);
  }}

  if(p>.63){const k=clamp((p-.63)/.37);const approach=smooth(k/.57),slide=smooth((k-.51)/.49);
   const maxW=W*1.32;const w=mix(Math.max(W*.15,b.w*.22),maxW,approach);
   const x=mix(b.x+b.w*.58,W*.51,approach)+Math.sin(k*3)*W*.014;
   const y=mix(b.y+b.h*.4,H*.50,approach)+slide*H*1.65;
   note(ctx,{...hero,w,rot:mix(-.24,.075,approach)+slide*.15},x,y,k*2,1,1);
  }

  const gather=ease(p/.88);

   note(ctx,n,x,y,(1-gather)*1.2,1-smooth((p-.84)/.13),mix(.5,1,gather))}
  // Underlying live camera is enabled on the reveal callback, not drawn from
  // the old cached screenshot.

}
function setupIce(intensity){
 shards=[];const b=field.bounds,cols=Math.round(mix(9,23,clamp(intensity/100))),rows=Math.max(6,Math.round(cols*b.h/b.w));

 for(let y=0;y<=rows;y++){const row=[];for(let x=0;x<=cols;x++)row.push({x:b.x+x*dx+(x===0||x===cols?0:rand(-dx*.17,dx*.17)),

 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
  const a=vs[y][x],bb=vs[y][x+1],c=vs[y+1][x],d=vs[y+1][x+1];
  for(const vertices of [[a,bb,c],[bb,d,c]]){
   const L=Math.max(0,Math.floor(Math.min(...vertices.map(p=>p.x))-3)),T=Math.max(0,Math.floor(Math.min(...vertices.map(p=>p.y))-3));
   const R=Math.min(W,Math.ceil(Math.max(...vertices.map(p=>p.x))+3)),B=Math.min(H,Math.ceil(Math.max(...vertices.map(p=>p.y))+3));

   // The custom per-shard canvas is cropped but never resized or blurred.

   g.save();g.translate(-L,-T);g.beginPath();g.moveTo(vertices[0].x,vertices[0].y);vertices.slice(1).forEach(v=>g.lineTo(v.x,v.y));g.closePath();g.clip();
   g.drawImage(subject,0,0,W,H);g.restore();
   let presence=0;const pix=g.getImageData(0,0,c.width,c.height).data;
   for(let z=3;z<pix.length;z+=24)if(pix[z]>100)presence++;

   const cx=(vertices[0].x+vertices[1].x+vertices[2].x)/3,cy=(vertices[0].y+vertices[1].y+vertices[2].y)/3;

function drawShard(s,cx,cy,angle,opacity=1){

 ctx.globalAlpha=clamp(opacity)*.36;ctx.lineWidth=3;ctx.strokeStyle='rgba(60,174,238,.48)';ctx.stroke();ctx.restore();
}
function drawIceCover(p){drawSubject(1);if(p<.23)return;const k=smooth((p-.23)/.68);
 ctx.save();ctx.globalAlpha=k;for(const s of shards){ctx.beginPath();s.edges.forEach((v,i)=>i?ctx.lineTo(s.cx+v[0],s.cy+v[1]):ctx.moveTo(s.cx+v[0],s.cy+v[1]));ctx.closePath();ctx.lineWidth=1.5;ctx.strokeStyle='rgba(189,237,255,.74)';ctx.stroke()}

function drawIce(t,dir,dur){const p=clamp(t/dur);
 if(dir==='out'){
  if(p<.11){shards.forEach(s=>drawShard(s,s.cx,s.cy,0));return}

}
function makePuff(color,seed){const c=document.createElement('canvas');c.width=256;c.height=256;const g=c.getContext('2d');

  const a=j*2.399+seed*.71,d=rand(0,34),x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d,rad=rand(51,96);

  if(isToxic){grad.addColorStop(0,'rgba(108,230,38,.13)');grad.addColorStop(.30,'rgba(54,154,19,.12)');grad.addColorStop(.76,'rgba(18,83,20,.09)')}

function setupCloud(effect,intensity){

  const p=field.points[Math.floor(rand(0,field.points.length))],edge=i%4===0;
  const x=p[0]+rand(-b.w*.10,b.w*.10),y=p[1]+rand(-b.h*.08,b.h*.08);

function drawClouds(t,direction='out',cover=false){

  let progress,opacity,scale,x,y;

   progress=smooth(p);opacity=c.a*(1-smooth((p-.60)/.4));scale=1.25+p*1.4;
   x=c.x+c.dx*p+Math.sin(p*9+c.seed)*W*.04;y=c.y+c.dy*p;
  }else{
   progress=ease(p/.87);opacity=c.a*(1-smooth((p-.64)/.32));scale=mix(2.2,.78,progress);

function drawSmokeCover(p){

async function signal(action,id,reason=''){try{const r=await fetch('/'+action+'?id='+id+(reason?'&reason='+encodeURIComponent(reason):''),{method:'POST',cache:'no-store'});if(!r.ok)console.warn('Bridge rejected',action,r.status)}catch(err){console.warn(action,err)}}
function animate(now){resize();ctx.clearRect(0,0,W,H);
 if(stage==='cover'&&job){const p=clamp((now-coverStarted)/coverTime(job.effect));drawCover(p);
   if(p>=1&&!ackCovered){ackCovered=true; if(!demo)signal('covered',jobId)}}
 else if(stage==='play'&&job){const t=clamp((now-started)/1000,0,job.duration);playEffect(t);
   const p=clamp(t/job.duration);
   if(job.direction==='in'&&!ackReveal&&p>=.86){ackReveal=true;if(!demo)signal('reveal',jobId)}
   if(p>=1&&!ackDone){ackDone=true;stage='done';if(!demo)signal('done',jobId)}

}
requestAnimationFrame(animate);
async function prepare(state){const id=state.job_id;loading=true;stage='loading';jobId=id;
 try{
  const img=await image('/frame.png?job='+id+'&nonce='+Date.now());field=silhouette(img);subject=field.image;
  job=state;
  if(state.effect==='money'){if(!bill)bill=await image('./bill.png');setupMoney(state.intensity)}
  else if(state.effect==='ice')setupIce(state.intensity);
  else setupCloud(state.effect,state.intensity);
  stage='prepared';ackCovered=ackReveal=ackDone=false;
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  if(stage==='prepared')await signal('ready',id)
 }catch(e){stage='idle';job=null;await signal('error',id,e.message||String(e));console.error(e)}finally{loading=false}
}
async function poll(){if(demo||loading)return;
 try{const s=await(await fetch('/state?ts='+Date.now(),{cache:'no-store'})).json();
  if(s.phase==='idle'){if(stage!=='idle'){stage='idle';job=null;subject=null}}
  else if(s.phase==='prepare'&&s.job_id!==jobId){await prepare(s)}
  else if(s.job_id===jobId&&s.phase==='cover'&&stage==='prepared'){job=s;stage='cover';coverStarted=performance.now();ackCovered=false}
  else if(s.job_id===jobId&&s.phase==='play'&&['cover','prepared'].includes(stage)){job=s;stage='play';started=performance.now();ackReveal=ackDone=false}
 }catch(e){/* local engine may be starting up */}
}
